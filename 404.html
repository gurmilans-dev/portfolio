<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <script>(function (d) { var t; try { t = localStorage.getItem("portfolio-theme"); } catch (e) {} if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; d.dataset.theme = t; d.classList.add("js"); if (t === "light") document.querySelector('meta[name="theme-color"]').content = "#f4f4f1"; })(document.documentElement);</script>
    <title>Page not found - {{profile.name}}</title>
    <meta name="description" content="The requested page could not be found." />
    <meta name="robots" content="noindex, follow" />
    <link rel="preload" href="assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/script.js" defer></script>
  </head>
  <body class="page-404">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{> header page}}
    <main id="main-content">
      <section id="top" class="frame not-found" aria-labelledby="not-found-title">
        <p class="label label-accent">Error 404</p>
        <p class="trace-404" aria-hidden="true"><span>L4 Interface</span><span>L3 Application</span><span>L2 Data</span><span>No such route</span></p>
        <h1 id="not-found-title">This route has no implementation.</h1>
        <p>The link may be outdated, but every system in the portfolio is still where it should be.</p>
        <div class="actions">
          <a class="btn btn-primary" href="index.html#work">View selected work<span aria-hidden="true">→</span></a>
          <a class="btn btn-line" href="index.html">Back to home</a>
        </div>
      </section>
    </main>
    {{> footer}}
  </body>
</html>

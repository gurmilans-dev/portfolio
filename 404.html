<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>Page not found - {{profile.name}}</title>
    <meta name="description" content="The requested page could not be found." />
    <meta name="robots" content="noindex, follow" />
    <link rel="preload" href="assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
    {{> head-boot}}
    <script src="assets/script.js" defer></script>
  </head>
  <body class="page-404">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{> header page}}
    <main id="main-content">
      <section id="top" class="frame not-found" aria-labelledby="not-found-title">
        <p class="label label-accent">Error 404</p>
        <p class="trace-404" aria-hidden="true"><span>L4 Interface</span><span>L3 Application</span><span>L2 Data</span><span>No such route</span></p>
        <h1 id="not-found-title">This route has no implementation.</h1>
        <p>The link may be out of date. Every project is still on the homepage.</p>
        <div class="actions">
          <a class="btn btn-primary" href="index.html#work">View selected work<span aria-hidden="true">→</span></a>
          <a class="btn btn-line" href="index.html">Back to home</a>
        </div>
      </section>
    </main>
    {{> footer}}
    <script>
      /* Pages are linked at clean URLs (/flowbank-one), as the host serves them. A local
         preview server that does not map clean URLs to files answers with this page instead,
         so try the file before showing a 404. The host never sends an existing page here, so
         in production this costs one HEAD request on a genuine 404 and changes nothing. */
      (function () {
        var path = location.pathname.replace(/\/$/, "");
        if (!path || path.indexOf("/", 1) !== -1 || /\.[a-z0-9]+$/i.test(path)) return;
        fetch(path + ".html", { method: "HEAD" }).then(function (response) {
          if (response.ok && !response.redirected) location.replace(path + ".html" + location.search + location.hash);
        }).catch(function () {});
      })();
    </script>
  </body>
</html>

name: CI

# Build the static site and run the content/claims validator on every push and PR.
# Install the locked development dependencies for HTML parsing and regression tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install development dependencies
        run: npm ci --include=dev
      - name: Build dist/
        run: node build.mjs
      - name: Validate templates, links, metadata, and claims
        run: npm test

name: CI

# Build the static site, run the content/claims validator, then drive the built site in
# headless Chrome (preinstalled on GitHub's Ubuntu runners) for the behaviour checks.
# Install the locked development dependencies for HTML parsing and image work.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ for the global WebSocket the browser tests use.
          node-version: 24
          cache: npm
      - name: Install development dependencies
        run: npm ci --include=dev
      - name: Build dist/
        run: node build.mjs
      - name: Validate templates, links, metadata, and claims
        run: npm test
      - name: Browser regression tests
        run: npm run test:browser
